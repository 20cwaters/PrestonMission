# The site is plain static files with no build step, so Netlify just serves
# the repository root as-is.

[build]
  publish = "."
  command = ""

# Photos are content-addressed by filename and never change once written,
# so they can be cached hard. The HTML and data files must not be, or people
# would keep seeing last week's letter.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
